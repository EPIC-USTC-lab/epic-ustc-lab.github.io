{{ if eq .Section "research" }}
  <style>
    body.research-lightbox-open {
      overflow: hidden;
    }

    .research-lightbox {
      position: fixed !important;
      inset: 0 !important;
      z-index: 10000 !important;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      margin: 0 !important;
      background: rgba(8, 14, 22, 0.94);
    }

    .research-lightbox[hidden] {
      display: none !important;
    }

    .research-lightbox__toolbar {
      display: flex;
      justify-content: flex-end;
      padding: 0.75rem;
    }

    .research-lightbox__control {
      display: inline-flex;
      width: 2.5rem;
      height: 2.5rem;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 4px;
      background: rgba(15, 23, 34, 0.82);
      color: #fff;
      cursor: pointer;
    }

    .research-lightbox__control:hover,
    .research-lightbox__control:focus-visible {
      border-color: #fff;
      background: #fff;
      color: #111827;
    }

    .research-lightbox__stage {
      display: flex;
      min-width: 0;
      min-height: 0;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .research-lightbox__image {
      display: block;
      max-width: calc(100vw - 3rem);
      max-height: calc(100vh - 6rem);
      transform-origin: center;
      user-select: none;
      will-change: transform;
      -webkit-user-drag: none;
    }

    @media (max-width: 767px) {
      .research-lightbox__image {
        max-width: calc(100vw - 1.5rem);
        max-height: calc(100vh - 5.5rem);
      }
    }
  </style>
  {{ $researchLightbox := resources.Get "js/research-lightbox.js" | js.Build (dict "minify" true) }}
  <script src="{{ $researchLightbox.RelPermalink }}" defer></script>
{{ end }}
